; ====================================================================
; M5Stack PaperColor 桌面学习终端 - PlatformIO 配置文件
; 项目名称: PaperColor_Study
; 硬件配置: ESP32-S3R8 (8MB OPI PSRAM, 16MB Flash), 4" 600x400 Spectra 6 彩色墨水屏
; ====================================================================

[env:m5stack-papercolor]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; 闪存与 PSRAM 核心配置 (16MB Flash + Octal PSRAM)
; 用 tts_16MB.csv：额外含 voice_data 分区(3MB @ 0xC90000) 存 TTS 模型（已由 esptool 烧入）
board_upload.flash_size = 16MB
board_build.partitions = tts_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

; 串口与烧录速度
monitor_speed = 115200
; 460800：921600 写大固件(2.6MB)会断连(用户实测坑)，降到 460800 更稳
upload_speed = 460800

; 编译与原生 USB 宏定义
; 重要（2026-08-09 修正）：upload 日志显示 "USB mode: USB-Serial/JTAG"，
; 证明板子 USB-C 直连 ESP32-S3 内置 USB 外设（无独立 USB-UART 桥芯片）。
; 因此 COM4 = USB-JTAG 虚拟串口 = ESP32-S3 内置 USB。
; 必须让 Serial  USB CDC（CDC_ON_BOOT=1）才能与 COM4 互通！
; 之前误设 =0 让 Serial 走 UART0(GPIO43/44)，但 UART0 根本没接到电脑，导致串口全失效。
build_flags = 
    -DBOARD_HAS_PSRAM
    -DCONFIG_SPIRAM_SUPPORT
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    ; 强制 M5Unified 使用 RMT v2 驱动 RGB LED（PlatformIO 无 sdkconfig.h 导致 M5UNIFIED_RMT_VERSION=0 空实现，LED 不亮！）
    -DM5UNIFIED_RMT_VERSION=2
    ; ===== esp-sr TTS (esp_tts_chinese + voice_set_xiaole) =====
    ; 预编译库自包含引擎+parser+AMR-WB解码，只需2个库；--start-group 解决 archive 循环引用
    -I lib/esptts/include
    -L lib/esptts
    -Wl,--start-group -lesp_tts_chinese -lvoice_set_xiaole -Wl,--end-group

; 依赖库扫描: 用 chain 而非 deep
; （deep 会递归扫描 lib/esptts 里的 .a 二进制导致 SCons 崩溃）
lib_ldf_mode = chain

; 依赖库声明
lib_deps = 
    m5stack/M5Unified @ ^0.2.5
    m5stack/M5GFX @ ^0.2.7
    bblanchon/ArduinoJson @ ^7.0.0
    adafruit/Adafruit NeoPixel @ ^1.10.0
